name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
      - name: Install pinned review tools
        run: |
          mkdir -p "$RUNNER_TEMP/review-tools"
          GOBIN="$RUNNER_TEMP/review-tools" go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          GOBIN="$RUNNER_TEMP/review-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 120 --output "$archive"             https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$archive" | sha256sum --check -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$RUNNER_TEMP/review-tools/"
          echo "$RUNNER_TEMP/review-tools" >> "$GITHUB_PATH"
      - name: Shell lint, release authority and source advisories
        run: |
          bash scripts/check-shell.sh
          python3 scripts/test-release-auth.py
          python3 scripts/check-release-gates.py --report-only
          govulncheck ./...
      - name: Build pinned validation core
        run: |
          git clone https://github.com/XTLS/Xray-core.git "$RUNNER_TEMP/xray-src"
          git -C "$RUNNER_TEMP/xray-src" checkout 676eaf66f8f05d4d558ee7a74b4736623d3feeb9
          cd "$RUNNER_TEMP/xray-src"
          go build -ldflags='-checklinkname=0' -o "$RUNNER_TEMP/xray" ./main
          echo "XRAY=$RUNNER_TEMP/xray" >> "$GITHUB_ENV"
      - name: Vet
        run: go vet ./...
      - name: Check preview scripts and rollback accounting
        run: |
          bash -n scripts/managed-preview-server.sh scripts/build-managed-awg.sh
          python3 scripts/test-preview-rollback-usage.py
          python3 scripts/test-managed-preview-upgrade.py
          python3 scripts/test-release-tag.py
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Build
        run: make build-linux

      - name: Isolated bootstrap, subscription containment and service restart
        run: |
          go build -o "$RUNNER_TEMP/review-panel" .
          sudo python3 scripts/test-bootstrap.py --work "$RUNNER_TEMP/bootstrap-test"
          sudo python3 scripts/test-subscription-boundary.py --panel "$RUNNER_TEMP/review-panel" --work "$RUNNER_TEMP/subscription-boundary"
          sudo python3 scripts/test-encrypted-backup-cli.py --panel "$RUNNER_TEMP/review-panel" --work "$RUNNER_TEMP/encrypted-backup"
          sudo python3 scripts/test-router-systemd.py --panel "$RUNNER_TEMP/review-panel" --work "$RUNNER_TEMP/router-systemd"


  published-runtime-acceptance:
    # Pre-publication exact-byte VM acceptance is performed by the local signer.
    # This read-only job replays runtime integration against the published bytes;
    # source CI never rebuilds different legacy engines or requires a CI key.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
      - name: Authenticate the published runtime fixture
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG:-v$(make -s print-version)}"
          test "$tag" = "v$(make -s print-version)"
          assets="$RUNNER_TEMP/authenticated-release"
          mkdir -p "$assets"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          commit=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_commit"])' "$assets/RELEASE-MANIFEST.json")
          if test "$GITHUB_EVENT_NAME" = release; then test "$commit" = "$GITHUB_SHA"; fi
          python3 scripts/verify-release.py --assets "$assets" --tag "$tag" --commit "$commit"
          chmod +x "$assets/"*-linux-amd64 "$assets/"*-linux-arm64
          echo "REVIEWED_ASSETS=$assets" >> "$GITHUB_ENV"
      - name: Exercise the shipped userspace AmneziaWG engine and tools
        run: |
          go build -o "$RUNNER_TEMP/awg-helper" ./internal/coreinstall/testdata/awg-helper
          mkdir -p "$RUNNER_TEMP/awg-network-test"
          sudo python3 -u scripts/test-managed-awg.py \
            --panel "$REVIEWED_ASSETS/rovunet-linux-amd64" --helper "$RUNNER_TEMP/awg-helper" \
            --engine "$REVIEWED_ASSETS/amneziawg-go-linux-amd64" \
            --tool "$REVIEWED_ASSETS/awg-linux-amd64" --work "$RUNNER_TEMP/awg-network-test"
      - name: Exercise automatic complete 30-profile setup with shipped engines
        run: |
          sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOCACHE=$(go env GOCACHE)" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory "GIT_CONFIG_VALUE_0=$PWD" \
            python3 scripts/test-complete-setup.py \
            --panel "$REVIEWED_ASSETS/rovunet-linux-amd64" --xray "$REVIEWED_ASSETS/xray-linux-amd64" \
            --engine "$REVIEWED_ASSETS/amneziawg-go-linux-amd64" \
            --tool "$REVIEWED_ASSETS/awg-linux-amd64" \
            --sing-box "$REVIEWED_ASSETS/sing-box-linux-amd64" --mita "$REVIEWED_ASSETS/mita-linux-amd64" \
            --work "$RUNNER_TEMP/complete-setup-test"
