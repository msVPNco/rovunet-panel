name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # internal/dnsrouter's tests race on upstream main too; check the rest
      - name: Race
        run: go test -race $(go list ./... | grep -v /internal/dnsrouter)
      - name: Build
        run: make build-linux
