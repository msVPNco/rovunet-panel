name: Publish signed v1.21.2

# One-time owner-authorized publication. No signing secret enters Actions.
on:
  push:
    branches: [codex/publish-signed-v1.21.2]
    paths:
      - .github/workflows/publish-signed-v1212.yml
      - release-signatures/v1.21.2/**

permissions:
  contents: write

concurrency:
  group: publish-signed-v1.21.2
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'msVPNco/rovunet-panel' && github.ref == 'refs/heads/codex/publish-signed-v1.21.2'
    runs-on: ubuntu-24.04
    environment: production-release
    timeout-minutes: 15
    steps:
      - name: Check out the immutable accepted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ac23d1a3ed07009567e004415606da7fed8779d3
          path: source
          persist-credentials: false
      - name: Check out the locally signed public handoff
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: handoff
          persist-credentials: false
      - name: Authenticate all uploaded bytes before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 handoff/release-signatures/v1.21.2/publish.py
