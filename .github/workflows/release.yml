name: Release

# Publication is an explicit operation after the production gates are reviewed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact reviewed stable tag matching Makefile
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pick the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="$REQUESTED_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$tag" = "v$(make -s print-version)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null); then
            if [[ "$(jq -r .draft <<< "$existing")" == false ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              test "$(jq -r .target_commitish <<< "$existing")" = "$GITHUB_SHA"
            fi
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.tag.outputs.skip != 'true'
        with:
          go-version: '1.27.4'

      - name: Refuse legacy runtime rebuilding for version two
        if: steps.tag.outputs.skip != 'true'
        env:
          REVIEWED_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          case "$REVIEWED_TAG" in
            v1.*) ;;
            *) echo 'This workflow is the v1 runtime builder. Version two uses the exact reviewed source/runtime bundle, final VM acceptance and Windows-local production signature described in docs/releases/v2.0.0.md. Refusing to rebuild different legacy bytes.' >&2; exit 1 ;;
          esac

      - name: Report full qualification and validate the owner-authorized functional draft
        if: steps.tag.outputs.skip != 'true'
        run: |
          python3 scripts/check-release-gates.py --report-only
          python3 scripts/check-functional-release.py --tag "${{ steps.tag.outputs.tag }}"

      - name: Install pinned review tools
        if: steps.tag.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/review-tools"
          GOBIN="$RUNNER_TEMP/review-tools" go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          GOBIN="$RUNNER_TEMP/review-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 --max-time 120 --output "$archive"             https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$archive" | sha256sum --check -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$RUNNER_TEMP/review-tools/"
          echo "$RUNNER_TEMP/review-tools" >> "$GITHUB_PATH"
      - name: Shell lint, release authority and source advisories
        if: steps.tag.outputs.skip != 'true'
        run: |
          bash scripts/check-shell.sh
          python3 scripts/test-release-auth.py
          python3 scripts/check-release-gates.py --report-only
          govulncheck ./...
      - name: Build pinned validation core and source archive
        if: steps.tag.outputs.skip != 'true'
        run: |
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          echo "RELEASE_ASSETS=$assets" >> "$GITHUB_ENV"
          git clone https://github.com/XTLS/Xray-core.git "$RUNNER_TEMP/xray-src"
          cd "$RUNNER_TEMP/xray-src"
          git checkout 63ca2e0c1d31b89f67700c33842431f541fedd25
          test -z "$(git status --porcelain)"
          go build -ldflags='-checklinkname=0' -o "$RUNNER_TEMP/xray" ./main
          echo "XRAY=$RUNNER_TEMP/xray" >> "$GITHUB_ENV"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -buildvcs=true -ldflags='-s -w -checklinkname=0' -o "$assets/xray-linux-$arch" ./main
          done
          git archive --format=tar.gz --prefix=Xray-core/ --output="$assets/xray-source.tar.gz" HEAD
          cp LICENSE "$assets/LICENSE-xray.txt"

      - name: Validate panel and recovery scripts
        if: steps.tag.outputs.skip != 'true'
        run: |
          go vet ./...
          bash -n scripts/managed-preview-server.sh scripts/build-managed-awg.sh
          python3 scripts/test-preview-rollback-usage.py
          python3 scripts/test-managed-preview-upgrade.py
          python3 scripts/test-release-tag.py
          go test -count=1 ./...
          go test -race -count=1 ./...

      - name: Prepare pinned ARM64 cross-compiler
        if: steps.tag.outputs.skip != 'true'
        timeout-minutes: 5
        run: |
          archive=arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          sha=322f0b4482fc0d9fa0bb468134841f08d8c554c54ff5aa29a13a7a24bf7e1eb5
          url="https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/$archive"
          curl --fail --location --retry 2 --retry-max-time 180 --connect-timeout 15 --max-time 180 \
            --output "$RUNNER_TEMP/$archive" "$url"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/arm-gnu"
          tar -xJf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$RUNNER_TEMP/arm-gnu"
          compiler="$RUNNER_TEMP/arm-gnu/bin/aarch64-none-linux-gnu-gcc"
          test "$("$compiler" -dumpmachine)" = aarch64-none-linux-gnu
          echo "ARM64_CC=$compiler" >> "$GITHUB_ENV"
          {
            printf 'archive=%s\nsha256=%s\nurl=%s\n' "$archive" "$sha" "$url"
            "$compiler" --version
          } > "$RELEASE_ASSETS/ARM64-COMPILER.txt"

      - name: Build pinned AmneziaWG runtime assets and source archives
        if: steps.tag.outputs.skip != 'true'
        timeout-minutes: 8
        run: |
          GOARCH=amd64 CC=gcc bash scripts/build-managed-awg.sh "$RELEASE_ASSETS"
          GOARCH=arm64 CC="$ARM64_CC" bash scripts/build-managed-awg.sh "$RELEASE_ASSETS"

      - name: Build locked supplemental runtimes and corresponding sources
        if: steps.tag.outputs.skip != 'true'
        run: |
          python3 scripts/build-supplemental.py "$RELEASE_ASSETS"
          govulncheck -mode binary "$RELEASE_ASSETS/sing-box-linux-amd64"
          govulncheck -mode binary "$RELEASE_ASSETS/mita-linux-amd64"

      - name: Build panel and exercise actual AmneziaWG data path
        if: steps.tag.outputs.skip != 'true'
        run: |
          test -z "$(git status --porcelain)"
          tag="${{ steps.tag.outputs.tag }}"
          make build-linux VERSION="${tag#v}" COMMIT="${GITHUB_SHA::7}"
          for arch in amd64 arm64; do
            mv "rovunet-linux-$arch" "$RELEASE_ASSETS/"
            cp "$RELEASE_ASSETS/rovunet-linux-$arch" "$RELEASE_ASSETS/slipgate-linux-$arch"
          done
          test "$("$RELEASE_ASSETS/rovunet-linux-amd64" --version 2>&1)" = "rovunet ${tag} (${GITHUB_SHA::7})"
          go version -m "$RELEASE_ASSETS/rovunet-linux-amd64" | tee "$RELEASE_ASSETS/BUILD-INFO.txt"
          grep -q 'vcs.modified=false' "$RELEASE_ASSETS/BUILD-INFO.txt"
          go build -o "$RUNNER_TEMP/awg-helper" ./internal/coreinstall/testdata/awg-helper
          mkdir -p "$RUNNER_TEMP/awg-network-test"
          sudo python3 -u scripts/test-managed-awg.py \
            --panel "$RELEASE_ASSETS/rovunet-linux-amd64" --helper "$RUNNER_TEMP/awg-helper" \
            --engine "$RELEASE_ASSETS/amneziawg-go-linux-amd64" --tool "$RELEASE_ASSETS/awg-linux-amd64" \
            --work "$RUNNER_TEMP/awg-network-test"

      - name: Exercise automatic setup with release binaries
        if: steps.tag.outputs.skip != 'true'
        run: |
          sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOCACHE=$(go env GOCACHE)" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory "GIT_CONFIG_VALUE_0=$PWD" \
            python3 scripts/test-complete-setup.py \
            --panel "$RELEASE_ASSETS/rovunet-linux-amd64" --xray "$RELEASE_ASSETS/xray-linux-amd64" \
            --engine "$RELEASE_ASSETS/amneziawg-go-linux-amd64" \
            --tool "$RELEASE_ASSETS/awg-linux-amd64" \
            --sing-box "$RELEASE_ASSETS/sing-box-linux-amd64" --mita "$RELEASE_ASSETS/mita-linux-amd64" \
            --work "$RUNNER_TEMP/complete-setup-test"

      - name: Isolated bootstrap, subscription containment and service restart
        if: steps.tag.outputs.skip != 'true'
        run: |
          sudo python3 scripts/test-bootstrap.py --work "$RUNNER_TEMP/bootstrap-test"
          sudo python3 scripts/test-subscription-boundary.py --panel "$RELEASE_ASSETS/rovunet-linux-amd64" --work "$RUNNER_TEMP/subscription-boundary"
          sudo python3 scripts/test-encrypted-backup-cli.py --panel "$RELEASE_ASSETS/rovunet-linux-amd64" --work "$RUNNER_TEMP/encrypted-backup"
          sudo python3 scripts/test-router-systemd.py --panel "$RELEASE_ASSETS/rovunet-linux-amd64" --work "$RUNNER_TEMP/router-systemd"

      - name: Package accepted preview upgrade and checksums
        if: steps.tag.outputs.skip != 'true'
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          python3 scripts/package-preview-promotion.py --panel "$RELEASE_ASSETS/rovunet-linux-amd64" \
            --commit "$GITHUB_SHA" --version "${tag#v}" --output "$RELEASE_ASSETS"
          cp LICENSE "$RELEASE_ASSETS/LICENSE-panel.txt"
          tar -czf "$RELEASE_ASSETS/PANEL-THIRD-PARTY-LICENSES.tar.gz" NOTICE.md third_party_licenses
          cp install.sh "$RELEASE_ASSETS/install.sh"
          git archive --format=tar.gz --prefix=rovunet-panel/ --output="$RELEASE_ASSETS/panel-source.tar.gz" HEAD
          cd "$RELEASE_ASSETS"
          sha256sum * > BUILD-SHA256SUMS.txt
          sha256sum --check BUILD-SHA256SUMS.txt

      - name: Keep the tested assets for Windows-local signing
        if: steps.tag.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rovunet-${{ steps.tag.outputs.tag }}-unsigned
          path: ${{ env.RELEASE_ASSETS }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Prepare tested draft without publishing
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          awk -v h="## $tag" '$0==h{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Rovunet Panel $tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" "$RELEASE_ASSETS"/* --clobber
          echo 'Tested draft ready. Final acceptance, SHA256SUMS and the production signature are added from the reviewed Windows-local vault before publication.' >> "$GITHUB_STEP_SUMMARY"
