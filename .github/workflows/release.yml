name: Release

# Publishes slipgate-linux-amd64 / -arm64 (what install.sh and
# `slipgate update` download) as release v<VERSION>, VERSION being the one in
# the Makefile. Releases are deliberate: run the workflow by hand or push a
# v* tag. Pushing to main never publishes a release by itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(make -s print-version)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.tag.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.tag.outputs.skip != 'true'
        run: go test ./...

      - name: Build
        if: steps.tag.outputs.skip != 'true'
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          make build-linux VERSION="${tag#v}" COMMIT="${GITHUB_SHA::7}"
          sha256sum slipgate-linux-* > SHA256SUMS

      - name: Publish
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # Notes come from this version's CHANGELOG.md section when there is one
          awk -v h="## $tag" '$0==h{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md || true
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$tag" \
            slipgate-linux-amd64 slipgate-linux-arm64 SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Rovunet Panel $tag" \
            "${notes[@]}"
